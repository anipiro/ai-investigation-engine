[project]
name = "ai-investigation-engine"
version = "0.1.0"
description = "Multi-document AI investigation engine: hybrid retrieval + agentic RAG with citations"
requires-python = ">=3.11,<3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.162.0",
    "fastembed>=0.9.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.1",
    "pypdf>=6.21.2",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.20.0",
    "truststore>=0.10.5",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "fpdf2>=2.8.9",
    "huggingface-hub>=1.33.0",
    "pyarrow>=26.0.0",
    "pytest>=9.1.1",
]
