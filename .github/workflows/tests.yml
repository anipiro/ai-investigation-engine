name: tests

# Push/PR triggers are paused while the GitHub account's Actions billing lock is unresolved
# (jobs are rejected before they start). Re-enable them by restoring:
#   on: { push: {}, pull_request: {} }
on:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python 3.11
      - run: uv run pytest
